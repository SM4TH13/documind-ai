services:

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      database:
        condition: service_healthy

  frontend:

    image: node:22

  database:
    image: postgres:17

    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind123
      POSTGRES_DB: documind

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: